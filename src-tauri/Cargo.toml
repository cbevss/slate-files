[package]
name = "slate"
version = "0.1.2"
description = "Slate: a fast, clean file explorer for Windows and Linux"
authors = ["Slate contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "slate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["disk"] }
dirs = "5"
jwalk = "0.8"
rayon = "1"
trash = "5"
open = "5"
sha2 = "0.10"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
