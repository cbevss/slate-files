name: Build installers

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows
          - platform: ubuntu-22.04
            label: Linux
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build and (on tags) publish a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Slate ${{ github.ref_name }}
          releaseBody: See the assets below for Windows (.exe, .msi) and Linux (.rpm for Fedora, .deb, .AppImage) installers.
          releaseDraft: true

      - name: Upload installers as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slate-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore

  fedora-smoke:
    name: Fedora 45 install check
    needs: build
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: slate-Linux
          path: dist
      - name: Install the .rpm with dnf (resolves webkit2gtk4.1 and gtk3)
        run: |
          dnf -y install $(find dist -name '*.rpm' | head -n1)
          rpm -qi slate
          test -x /usr/bin/slate
