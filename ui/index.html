<div class="app" id="app">
  <header class="tabrow" data-tauri-drag-region>
    <div class="tabs" id="tabs" role="tablist" aria-label="Open folders"></div>
    <button class="newtab" id="newtab" title="New tab (Ctrl+T)" aria-label="New tab"><svg class="i"><use href="#i-plus"/></svg></button>
    <div class="drag" data-tauri-drag-region></div>
    <div class="winctl">
      <button id="w-min" aria-label="Minimise"><svg class="i"><use href="#i-min"/></svg></button>
      <button id="w-max" aria-label="Maximise"><svg class="i"><use href="#i-max"/></svg></button>
      <button id="w-close" class="x" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
  </header>

  <div class="toolbar panel">
    <button class="ib" id="back" title="Back (Alt+Left)" aria-label="Back"><svg class="i"><use href="#i-back"/></svg></button>
    <button class="ib" id="fwd" title="Forward (Alt+Right)" aria-label="Forward"><svg class="i"><use href="#i-fwd"/></svg></button>
    <button class="ib" id="up" title="Up one level (Alt+Up)" aria-label="Up one level"><svg class="i"><use href="#i-up"/></svg></button>
    <nav class="path" id="path" aria-label="Location"></nav>
    <div class="seg" role="group" aria-label="Layout">
      <span class="thumb" id="segthumb"></span>
      <button data-layout="single" title="Single pane (Ctrl+1)" aria-label="Single pane"><svg class="i"><use href="#i-l-single"/></svg></button>
      <button data-layout="dual" title="Two panes (Ctrl+2)" aria-label="Two panes"><svg class="i"><use href="#i-l-dual"/></svg></button>
      <button data-layout="preview" title="With preview (Ctrl+3)" aria-label="With preview"><svg class="i"><use href="#i-l-prev"/></svg></button>
    </div>
    <button class="search" id="search" aria-label="Search everything"><svg class="i"><use href="#i-search"/></svg><span class="lbl">Search everything</span><kbd>Ctrl K</kbd></button>
  </div>

  <main class="body" id="body">
    <section class="col" id="col-side">
      <div class="panel side" id="side" aria-label="Places"></div>
    </section>
    <section class="col" id="col-a">
      <div class="splitter" data-split="side" title="Drag to resize"></div>
      <div class="panel pane" id="pane-a"></div>
    </section>
    <section class="col off" id="col-b">
      <div class="panel pane" id="pane-b"></div>
    </section>
    <section class="col" id="col-prev">
      <div class="splitter" data-split="prev" title="Drag to resize"></div>
      <aside class="panel prev" id="prev" aria-label="Preview"></aside>
    </section>
  </main>

  <footer class="status panel num" id="status">
    <span id="st-count"></span>
    <span class="sel" id="st-sel"></span>
    <div class="xfer" id="xfer" aria-live="polite">
      <span class="lbl" id="x-lbl"></span>
      <div class="track"><i id="x-bar" style="width:0"></i></div>
      <span id="x-info"></span>
      <button class="ib" id="x-pause" aria-label="Pause transfer"><svg class="i"><use href="#i-pause"/></svg></button>
      <button class="ib" id="x-cancel" aria-label="Cancel transfer"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <span class="drv" id="st-drv"></span>
  </footer>
</div>

<div class="scrim" id="pal-scrim" hidden>
  <div class="palette" role="dialog" aria-label="Search and commands">
    <div class="q"><svg class="i"><use href="#i-search"/></svg><input id="pal-input" placeholder="Search files, folders and actions" autocomplete="off" spellcheck="false"><span class="count num" id="pal-count"></span></div>
    <ul id="pal-list" role="listbox"></ul>
    <div class="foot"><span><kbd>↑</kbd> <kbd>↓</kbd> to move</span><span><kbd>Enter</kbd> to open</span><span><kbd>Esc</kbd> to close</span><span style="margin-left:auto" id="pal-idx"></span></div>
  </div>
</div>

<div class="scrim" id="dlg-scrim" hidden>
  <div class="dialog" role="dialog" aria-labelledby="dlg-title">
    <h2 id="dlg-title"></h2>
    <p id="dlg-sub"></p>
    <div id="dlg-body"></div>
    <div class="row-end"><button class="btn" id="dlg-cancel">Cancel</button><button class="btn primary" id="dlg-ok"></button></div>
  </div>
</div>

<div class="menu" id="menu" role="menu" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="data.js"></script>
<script src="fs.js"></script>
<script src="app.js"></script>
</body>
</html>
